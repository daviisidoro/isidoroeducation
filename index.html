<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Isidoro Education - Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração Tailwind Customizada -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease forwards',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)',
                        'toast-in': 'toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { 'from': { opacity: '0' }, 'to': { opacity: '1' } },
                        fadeInUp: { 'from': { opacity: '0', transform: 'translate3d(0, 20px, 0)' }, 'to': { opacity: '1', transform: 'translate3d(0, 0, 0)' } },
                        scaleIn: { 'from': { opacity: '0', transform: 'scale3d(0.95, 0.95, 1)' }, 'to': { opacity: '1', transform: 'scale3d(1, 1, 1)' } },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        },
                        toastIn: {
                            '0%': { opacity: '0', transform: 'translate3d(0, 20px, 0) scale3d(0.9, 0.9, 1)' },
                            '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale3d(1, 1, 1)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* Scrollbar Premium */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(34, 211, 238, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(99, 102, 241, 0.6); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(34, 211, 238, 0.8); }

        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Autofill fix */
        .dark input:-webkit-autofill, .dark input:-webkit-autofill:hover, .dark input:-webkit-autofill:focus, .dark input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0A0A0C inset !important;
            -webkit-text-fill-color: white !important;
        }

        .animate-blob {
            will-change: transform;
            transform: translateZ(0);
        }

        /* Ocultar elementos */
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#050507] text-slate-900 dark:text-white overflow-hidden w-full max-w-[100vw] transition-colors duration-500">

    
    <!-- Background Effects Globais -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] bg-blue-400/20 dark:bg-cyan-600/10 rounded-full blur-[120px] mix-blend-multiply dark:mix-blend-screen animate-blob"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-indigo-400/20 dark:bg-purple-600/10 rounded-full blur-[150px] mix-blend-multiply dark:mix-blend-screen animate-blob animation-delay-2000"></div>
        <div class="absolute top-[40%] left-[20%] w-[40vw] h-[40vw] bg-sky-400/20 dark:bg-blue-600/10 rounded-full blur-[100px] mix-blend-multiply dark:mix-blend-screen animate-blob animation-delay-4000"></div>
    </div>

    <!-- TELA DE LOADING INICIAL -->
    <div id="initial-loading" class="fixed inset-0 z-[999] flex items-center justify-center bg-slate-50 dark:bg-[#050507]">
        <i data-lucide="loader-2" class="w-12 h-12 text-blue-600 dark:text-cyan-400 animate-spin drop-shadow-md dark:drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]"></i>
    </div>

    <!-- TELA DE LOGIN -->
    <div id="login-view" class="fixed inset-0 z-50 bg-slate-50 dark:bg-[#050507] hidden-safely overflow-y-auto">
        <button id="btn-theme-login" class="fixed top-4 right-4 md:top-6 md:right-8 z-50 p-2.5 md:p-3 text-slate-500 dark:text-white/70 hover:text-blue-600 dark:hover:text-white bg-white dark:bg-white/5 hover:bg-slate-50 dark:hover:bg-white/10 border border-slate-200 dark:border-transparent rounded-lg md:rounded-xl transition-all shadow-sm dark:shadow-none focus:outline-none shrink-0">
            <i data-lucide="sun" id="icon-theme-login" class="w-5 h-5"></i>
        </button>

        <div class="min-h-[100dvh] flex flex-col items-center justify-center p-4 py-12 md:p-8 w-full">
            <div class="w-full max-w-md relative z-10">
                <div class="mb-8 md:mb-10 text-center animate-fade-in-up flex flex-col items-center">
                    <img src="logo.png" alt="Isidoro Education Logo" class="w-48 md:w-56 h-auto object-contain relative z-10 transition-transform hover:scale-105 filter drop-shadow-sm dark:drop-shadow-[0_0_20px_rgba(34,211,238,0.3)] mb-4 md:mb-6" onerror="this.src='https://placehold.co/600x400/transparent/001f3f?text=Isidoro+Education'" />
                    <p class="text-blue-600 dark:text-cyan-400/80 mt-1 md:mt-2 text-[10px] md:text-xs font-bold tracking-[0.2em] md:tracking-[0.3em] uppercase">Enterprise Protocol</p>
                </div>

                <div class="bg-white/80 dark:bg-white/[0.02] backdrop-blur-3xl p-5 md:p-10 rounded-3xl md:rounded-[2.5rem] shadow-2xl dark:shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-slate-200 dark:border-white/10 animate-scale-in relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 dark:from-cyan-400 dark:via-blue-500 dark:to-purple-500"></div>
                    <form id="login-form" class="space-y-4 md:space-y-6">
                        <div id="register-name-group" class="space-y-1.5 md:space-y-2 group hidden-safely">
                            <label class="text-[9px] md:text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">Nome Completo</label>
                            <div class="relative">
                            <input type="text" id="login-name" placeholder="Ex: Davi Isidoro" class="relative w-full px-4 md:px-5 py-3 md:py-4 bg-white dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-xl md:rounded-2xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none transition-all text-sm md:text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 shadow-sm dark:shadow-inner" />
                        </div>
                    </div>
                    <div class="space-y-1.5 md:space-y-2 group">
                        <label class="text-[9px] md:text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">Credencial de Acesso</label>
                        <div class="relative">
                            <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-cyan-500 dark:to-purple-500 rounded-xl md:rounded-2xl blur opacity-0 group-focus-within:opacity-20 dark:group-focus-within:opacity-30 transition duration-500"></div>
                            <input type="email" id="login-email" placeholder="admin@isidoro.edu" required class="relative w-full px-4 md:px-5 py-3 md:py-4 bg-white dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-xl md:rounded-2xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none transition-all text-sm md:text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 shadow-sm dark:shadow-inner" />
                        </div>
                    </div>
                    <div class="space-y-1.5 md:space-y-2 group">
                        <label class="text-[9px] md:text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">Chave de Segurança</label>
                        <div class="relative">
                            <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-cyan-500 dark:to-purple-500 rounded-xl md:rounded-2xl blur opacity-0 group-focus-within:opacity-20 dark:group-focus-within:opacity-30 transition duration-500"></div>
                            <input type="password" id="login-password" placeholder="••••••••" required class="relative w-full px-4 md:px-5 py-3 md:py-4 bg-white dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-xl md:rounded-2xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none transition-all text-sm md:text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 shadow-sm dark:shadow-inner" />
                        </div>
                    </div>
                    
                    <button type="submit" id="btn-submit-login" class="w-full relative flex items-center justify-center px-5 md:px-6 py-3.5 md:py-4 mt-6 md:mt-8 rounded-xl md:rounded-2xl font-black text-white transition-all shadow-lg dark:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:shadow-xl dark:hover:shadow-[0_0_40px_rgba(34,211,238,0.5)] hover:-translate-y-1 group overflow-hidden bg-slate-900 dark:bg-[#0A0A0C] border border-slate-800 dark:border-cyan-500/50">
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-cyan-500 dark:to-purple-600 opacity-90 dark:opacity-20 group-hover:opacity-100 dark:group-hover:opacity-40 transition-opacity"></div>
                        <span class="relative z-10 flex items-center gap-2 md:gap-3 tracking-widest uppercase text-[10px] md:text-xs" id="login-btn-content">
                            <span class="mt-0.5">Autorizar Acesso</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </span>
                    </button>
                    <button type="button" id="btn-create-account" class="w-full mt-3 px-5 py-3.5 md:py-4 rounded-xl md:rounded-2xl font-bold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 transition-all text-[10px] md:text-xs tracking-widest uppercase border border-transparent hover:border-slate-300 dark:hover:border-white/10 flex items-center justify-center group">
                        <span id="create-account-content">Criar Nova Conta</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-view" class="h-[100dvh] w-full max-w-[100vw] flex hidden-safely relative z-10 p-0 md:p-2 lg:p-0">
        
        <!-- Sidebar Desktop -->
        <div id="sidebar-desktop" class="hidden md:flex flex-col h-full bg-white/70 dark:bg-[#050507]/60 backdrop-blur-3xl border-r md:border border-slate-200 dark:border-white/5 md:rounded-3xl overflow-hidden w-72 md:w-[260px] lg:w-72 transition-all duration-500 z-50 shadow-xl dark:shadow-[0_0_50px_rgba(0,0,0,0.5)] m-0 md:m-3 lg:m-4 shrink-0">
            <div class="p-6 md:p-8 flex items-center justify-center relative">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 dark:from-cyan-500/10 to-transparent pointer-events-none"></div>
                <img src="logo.png" alt="Logo" class="w-full max-w-[160px] lg:max-w-[180px] h-auto object-contain relative z-10 transition-transform hover:scale-105 filter drop-shadow-sm dark:drop-shadow-[0_0_10px_rgba(34,211,238,0.2)]" onerror="this.src='https://placehold.co/600x400/transparent/001f3f?text=Isidoro+Education'"/>
            </div>
            <nav id="nav-desktop" class="flex-1 px-3 md:px-4 py-2 space-y-1.5 overflow-y-auto custom-scrollbar relative z-10"></nav>
            <div class="p-4 md:p-6 relative z-10">
                <button data-action="logout" class="w-full flex items-center justify-center gap-2 md:gap-3 px-4 md:px-5 py-3 md:py-4 rounded-xl md:rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-500/20 hover:bg-rose-100 dark:hover:bg-rose-500 hover:text-rose-700 dark:hover:text-white transition-all font-bold group shadow-sm dark:shadow-none text-sm md:text-base">
                    <i data-lucide="log-out" class="w-4 h-4 md:w-5 md:h-5 group-hover:-translate-x-1 transition-transform pointer-events-none"></i>
                    <span class="pointer-events-none">Desconectar</span>
                </button>
            </div>
        </div>

        <!-- Sidebar Mobile (Drawer) -->
        <div id="sidebar-mobile-container" class="md:hidden fixed inset-0 z-50 flex hidden-safely">
            <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 dark:bg-black/80 backdrop-blur-sm animate-fade-in"></div>
            <div class="relative w-72 h-full animate-slide-in-left flex flex-col bg-white/95 dark:bg-[#050507]/95 backdrop-blur-3xl shadow-2xl">
                <div class="p-6 flex items-center justify-center relative border-b border-slate-200 dark:border-white/5">
                    <img src="logo.png" alt="Logo" class="w-32 h-auto object-contain relative z-10" onerror="this.src='https://placehold.co/600x400/transparent/001f3f?text=Isidoro'"/>
                </div>
                <nav id="nav-mobile" class="flex-1 px-4 py-4 space-y-2 overflow-y-auto custom-scrollbar relative z-10"></nav>
                <div class="p-6 border-t border-slate-200 dark:border-white/5">
                    <button data-action="logout" class="w-full flex items-center justify-center gap-3 px-5 py-4 rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold">
                        <i data-lucide="log-out" class="w-5 h-5 pointer-events-none"></i> Sair
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 h-full relative overflow-x-hidden w-full">
            <header class="flex items-center justify-between px-3 md:px-8 py-3 md:py-6 mx-3 md:mx-4 mt-3 md:mt-4 bg-white/70 dark:bg-white/5 backdrop-blur-2xl border border-slate-200 dark:border-white/10 rounded-2xl md:rounded-3xl shadow-sm dark:shadow-[0_10px_30px_rgba(0,0,0,0.5)] z-20 shrink-0">
                <div class="flex items-center gap-3 md:gap-4">
                    <button id="btn-menu-mobile" class="md:hidden p-2 text-slate-600 dark:text-white bg-slate-100 dark:bg-white/10 rounded-lg md:rounded-xl shrink-0">
                        <i data-lucide="menu" class="w-5 h-5 pointer-events-none"></i>
                    </button>
                    <div class="hidden md:flex items-center relative w-56 lg:w-96 group">
                        <i data-lucide="search" class="w-4 h-4 md:w-5 md:h-5 absolute left-4 text-slate-400 group-focus-within:text-blue-500 dark:group-focus-within:text-cyan-400 transition-colors pointer-events-none"></i>
                        <input type="text" id="global-search" placeholder="Pesquisar registros..." class="w-full pl-10 md:pl-12 pr-4 py-2.5 md:py-3 rounded-xl md:rounded-2xl bg-white dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none text-xs md:text-sm transition-all shadow-sm dark:shadow-inner placeholder:text-slate-400 dark:text-white" />
                    </div>
                </div>

                <div class="flex items-center gap-3 md:gap-5">
                    <button id="btn-theme-app" class="p-2.5 md:p-3 text-slate-500 dark:text-white/70 hover:text-blue-600 dark:hover:text-white bg-white dark:bg-white/5 hover:bg-slate-50 dark:hover:bg-white/10 border border-slate-200 dark:border-transparent rounded-lg md:rounded-xl transition-all shadow-sm dark:shadow-none focus:outline-none shrink-0">
                        <i data-lucide="sun" id="icon-theme-app" class="w-4 h-4 md:w-5 md:h-5 pointer-events-none"></i>
                    </button>
                    <div class="flex items-center gap-3 md:gap-4 pl-3 md:pl-5 border-l border-slate-200 dark:border-white/10">
                        <div class="hidden sm:block text-right">
                            <p id="user-display-name" class="text-xs md:text-sm font-bold text-slate-800 dark:text-white leading-tight">Carregando...</p>
                            <p id="user-display-role" class="text-[9px] md:text-[10px] text-blue-600 dark:text-cyan-400 font-bold uppercase tracking-widest">Acesso de Rede</p>
                        </div>
                        <div class="w-9 h-9 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-white dark:bg-[#0A0A0C] border border-blue-200 dark:border-cyan-500/50 flex items-center justify-center text-blue-700 dark:text-white font-black shadow-md dark:shadow-[0_0_15px_rgba(34,211,238,0.3)] cursor-pointer hover:scale-105 transition-transform relative text-sm md:text-base">
                            <div class="absolute -top-1 -right-1 w-2.5 h-2.5 md:w-3 md:h-3 bg-emerald-500 dark:bg-cyan-400 rounded-full border-2 border-white dark:border-[#0A0A0C] animate-pulse"></div>
                            <span id="user-avatar-initial">-</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto overflow-x-hidden w-full p-3 md:p-6 lg:p-8 custom-scrollbar mt-1 md:mt-2 relative z-10">
                <div id="main-content" class="max-w-7xl mx-auto pb-24 md:pb-20 w-full">
                    <!-- Conteúdo dinâmico injetado aqui -->
                </div>
            </main>
        </div>
    </div>


    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-4 right-4 md:bottom-8 md:right-8 z-[9999] flex flex-col gap-3 md:gap-4 pointer-events-none"></div>

    <!-- MODAL CUSTOMIZADO DE CONFIRMAÇÃO (Substitui confirm()) -->
    <div id="modal-confirm" class="fixed inset-0 z-[1000] flex items-center justify-center p-4 hidden-safely">
        <div class="absolute inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md animate-fade-in" id="modal-confirm-overlay"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-[#0A0A0C] border border-slate-200 dark:border-white/10 rounded-2xl md:rounded-3xl shadow-2xl animate-scale-in overflow-hidden p-6 text-center">
            <div class="w-16 h-16 mx-auto bg-rose-50 dark:bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mb-4 border border-rose-200 dark:border-rose-500/20">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 id="modal-confirm-title" class="text-xl font-bold text-slate-900 dark:text-white mb-2">Atenção</h3>
            <p id="modal-confirm-text" class="text-slate-500 dark:text-slate-400 text-sm mb-6">Tem certeza que deseja prosseguir?</p>
            <div class="flex justify-center gap-3">
                <button id="btn-confirm-cancel" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-100 dark:bg-white/5 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors w-full">Cancelar</button>
                <button id="btn-confirm-ok" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-rose-500 text-white hover:bg-rose-600 shadow-lg shadow-rose-500/30 transition-colors w-full">Excluir</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE FORMULÁRIO GENÉRICO -->
    <div id="modal-form" class="fixed inset-0 z-[900] flex items-center justify-center p-3 md:p-4 hidden-safely">
        <div class="absolute inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md animate-fade-in" id="modal-form-overlay"></div>
        <div class="relative w-full max-w-lg bg-white dark:bg-[#0A0A0C] border border-slate-200 dark:border-white/10 rounded-2xl md:rounded-[2rem] shadow-2xl animate-scale-in flex flex-col max-h-[95dvh] md:max-h-[90vh]">
            <div class="flex items-center justify-between p-5 md:p-6 border-b border-slate-100 dark:border-white/5">
                <h3 id="modal-form-title" class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-500 dark:from-white dark:to-slate-400">Título</h3>
                <button id="btn-close-form" class="p-2 text-slate-400 hover:text-slate-700 dark:hover:text-white bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 rounded-full transition-all">
                    <i data-lucide="x" class="w-4 h-4 md:w-5 md:h-5 pointer-events-none"></i>
                </button>
            </div>
            <div class="p-5 md:p-6 overflow-y-auto custom-scrollbar">
                <form id="dynamic-form" class="space-y-4 md:space-y-5"></form>
            </div>
        </div>
    </div>

    <!-- MODAL VISUALIZADOR DE PDF -->
    <div id="modal-pdf" class="fixed inset-0 z-[950] flex items-center justify-center p-0 md:p-4 hidden-safely">
        <div class="absolute inset-0 bg-slate-900/90 dark:bg-black/95 backdrop-blur-2xl animate-fade-in"></div>
        <div class="relative w-full h-full max-w-6xl bg-white dark:bg-[#0A0A0C] md:border border-slate-200 dark:border-white/10 md:rounded-3xl shadow-2xl animate-scale-in flex flex-col overflow-hidden">
            <div class="flex justify-between items-center p-4 md:p-5 border-b border-slate-200 dark:border-white/10 bg-slate-100 dark:bg-[#050507]">
                <h3 class="text-slate-800 dark:text-cyan-400 font-bold text-xs md:text-sm tracking-widest uppercase">Visualizador de Documento</h3>
                <button id="btn-close-pdf" class="p-2 text-slate-500 dark:text-white/50 hover:text-slate-900 dark:hover:text-white bg-slate-200 dark:bg-white/5 hover:bg-slate-300 dark:hover:bg-white/10 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5 pointer-events-none"></i></button>
            </div>
            <div class="flex-1 w-full h-full bg-slate-200 dark:bg-slate-800 flex justify-center p-2 md:p-0">
                <iframe id="pdf-iframe" src="" class="w-full h-full border-0 md:rounded-b-3xl"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';

                ${val === 'Ativo' ? '<div class="w-1.5 h-1.5 rounded-full bg-emerald-500 dark:bg-cyan-400 mr-1.5 md:mr-2 animate-pulse"></div>' : ''}

        function showToast(message, type = 'info') {
            const container = $('toast-container');

            const styles = type === 'success' 
                ? 'bg-white/95 dark:bg-[#0A0A0C]/95 border-emerald-200 dark:border-cyan-500/30 text-emerald-700 dark:text-cyan-400'

                : 'bg-white/95 dark:bg-[#0A0A0C]/95 border-slate-200 dark:border-white/10 text-slate-800 dark:text-white';
            
            const icon = type === 'success' ? 'check' : type === 'error' ? 'alert-circle' : 'info';

            toast.className = `flex items-center gap-3 md:gap-4 px-4 md:px-6 py-4 md:py-5 rounded-xl md:rounded-2xl shadow-xl dark:shadow-[0_10px_40px_rgba(0,0,0,0.5)] backdrop-blur-2xl border font-bold text-xs md:text-sm pointer-events-auto animate-toast-in ${styles}`;

            container.appendChild(toast);
            lucide.createIcons({root: toast});

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function showConfirmModal(title, text, actionFn) {
            $('modal-confirm-title').innerText = title;
            $('modal-confirm-text').innerText = text;

        }
        $('btn-confirm-cancel').addEventListener('click', () => { $('modal-confirm').classList.add('hidden-safely'); state.confirmAction = null; });
        $('modal-confirm-overlay').addEventListener('click', () => $('btn-confirm-cancel').click());
        $('btn-confirm-ok').addEventListener('click', () => {
            if (state.confirmAction) state.confirmAction();

            state.confirmAction = null;
        });

        // --- THEME ---
        function toggleTheme() {
            state.isDarkMode = !state.isDarkMode;

        function applyTheme() {
            const html = document.documentElement;
            if (state.isDarkMode) {
                html.classList.add('dark');

                if($('icon-theme-login')) $('icon-theme-login').setAttribute('data-lucide', 'moon');
                if($('icon-theme-app')) $('icon-theme-app').setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }
        $('btn-theme-login').addEventListener('click', toggleTheme);
        $('btn-theme-app').addEventListener('click', toggleTheme);

        // --- MENU NAVIGATION ---
        const menuItems = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'schools', label: 'Unidades', icon: 'school' },
            { id: 'courses', label: 'Cursos', icon: 'book-marked' },
            { id: 'classes', label: 'Turmas', icon: 'layers' },
            { id: 'students', label: 'Discentes', icon: 'users' },

                    <span class="relative z-10 tracking-wide text-sm md:text-base pointer-events-none">${item.label}</span>
                </button>
            `).join('');

            $('nav-desktop').innerHTML = createMenuHTML();
            $('nav-mobile').innerHTML = createMenuHTML();
            lucide.createIcons({ root: $('nav-desktop') });
            lucide.createIcons({ root: $('nav-mobile') });
        }

        $('btn-menu-mobile').addEventListener('click', () => $('sidebar-mobile-container').classList.remove('hidden-safely'));
        $('sidebar-overlay').addEventListener('click', () => $('sidebar-mobile-container').classList.add('hidden-safely'));

        // --- STREAMING_CHUNK:Lógica Firebase e Data Fetching... ---

        async function initDataListeners() {
            if (!state.user) return;
            const uid = state.user.uid;
            const collections = ['schools', 'courses', 'classes', 'students', 'attendance', 'projects'];
            
            // Limpa antigos
            state.unsubscribes.forEach(unsub => unsub());
            state.unsubscribes = [];

            collections.forEach(colName => {
                const q = collection(db, `artifacts/${appIdStr}/users/${uid}/${colName}`);
                const unsub = onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    state.data[colName] = items;
                    renderCurrentView(); // Re-renderiza a tela atual com novos dados
                }, (error) => {
                    console.error(`Sync error ${colName}:`, error);
                });
                state.unsubscribes.push(unsub);
            });
        }

        const API = {
            add: async (colName, item) => {
                try {
                    await addDoc(collection(db, `artifacts/${appIdStr}/users/${state.user.uid}/${colName}`), { ...item, createdAt: Date.now() });
                    showToast('Registro salvo.', 'success');
                } catch(e) { showToast('Erro ao salvar.', 'error'); console.error(e); }
            },
            update: async (colName, id, item) => {
                try {
                    await updateDoc(doc(db, `artifacts/${appIdStr}/users/${state.user.uid}/${colName}`, id), { ...item, updatedAt: Date.now() });
                    showToast('Registro atualizado.', 'success');
                } catch(e) { showToast('Erro ao atualizar.', 'error'); console.error(e); }
            },
            remove: async (colName, id) => {
                try {
                    await deleteDoc(doc(db, `artifacts/${appIdStr}/users/${state.user.uid}/${colName}`, id));
                    showToast('Excluído com sucesso.', 'success');
                } catch(e) { showToast('Erro ao excluir.', 'error'); console.error(e); }
            }
        };

        // --- STREAMING_CHUNK:Motores de Renderização de Views... ---

            ];

            let html = `

                            Visão Global <i data-lucide="sparkles" class="w-5 h-5 md:w-6 md:h-6 text-blue-500 dark:text-cyan-400 animate-pulse"></i>
                        </h1>
                        <p class="text-slate-500 dark:text-slate-400 mt-1 md:mt-2 font-medium tracking-wide text-xs md:text-sm">Monitoramento central da rede Isidoro Education.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
            `;

            stats.forEach((s, i) => {
                html += `
                    <div class="relative bg-white/80 dark:bg-gradient-to-br dark:from-white/[0.05] dark:to-transparent rounded-2xl md:rounded-3xl border border-slate-200 dark:border-white/10 backdrop-blur-2xl overflow-hidden shadow-sm dark:shadow-none animate-fade-in-up transition-all duration-500 hover:-translate-y-1 hover:border-blue-300 dark:hover:border-cyan-500/30 group p-5 md:p-6" style="animation-delay: ${i*100}ms">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-gradient-to-br ${s.gradient} rounded-full blur-[40px] opacity-20 group-hover:opacity-40 transition-opacity duration-500 pointer-events-none"></div>
                        <div class="flex items-start justify-between relative z-10">
                            <div>
                                <p class="text-[10px] font-bold tracking-widest text-slate-500 dark:text-slate-400 uppercase mb-1 md:mb-2">${s.label}</p>
                                <h3 class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white drop-shadow-sm dark:drop-shadow-lg">${s.value}</h3>

                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        // Generic CRUD Generator HTML
        function generateCrudHTML(title, icon, items, columns, colName) {
            const searchTerm = $('global-search')?.value.toLowerCase() || '';
            const filtered = items.filter(it => Object.values(it).some(v => String(v).toLowerCase().includes(searchTerm)));

            let html = `
                <div class="space-y-6 md:space-y-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-fade-in-up">
                        <div class="flex items-center gap-3 md:gap-4">
                            <div class="p-2.5 md:p-3 bg-gradient-to-br from-blue-500/10 to-indigo-500/10 dark:from-cyan-500/20 dark:to-purple-500/20 rounded-xl md:rounded-2xl border border-blue-200/50 dark:border-white/10 shadow-sm dark:shadow-[0_0_20px_rgba(34,211,238,0.1)]">
                                <i data-lucide="${icon}" class="w-6 h-6 md:w-8 md:h-8 text-blue-600 dark:text-cyan-400"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tighter">${title}</h1>
                                <p class="text-blue-600 dark:text-cyan-400/80 mt-0.5 md:mt-1 font-medium tracking-wide text-xs md:text-sm">Gestão de banco de dados.</p>
                            </div>
                        </div>
                        <button data-action="open-form" data-col="${colName}" class="relative inline-flex items-center justify-center px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm transition-all duration-300 overflow-hidden group w-full sm:w-auto">
                            <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-cyan-500 dark:via-blue-600 dark:to-purple-600 opacity-90 group-hover:opacity-100 transition-opacity"></div>
                            <span class="relative z-10 flex items-center justify-center gap-2 text-white drop-shadow-md pointer-events-none">
                                <i data-lucide="plus" class="w-4 h-4"></i> Novo Registro
                            </span>
                        </button>
                    </div>
                    <div class="space-y-3 mt-2 md:mt-4">
            `;

            if (filtered.length === 0) {
                html += `<div class="bg-white/80 dark:bg-white/[0.05] rounded-2xl md:rounded-3xl border border-slate-200 dark:border-white/10 backdrop-blur-2xl py-12 md:py-20 text-center animate-fade-in-up"><p class="text-sm md:text-base text-slate-500 font-medium">Nenhuma informação localizada.</p></div>`;
            } else {
                filtered.forEach((item, index) => {

                    `;
                    columns.forEach(col => {
                        let renderVal = item[col.key] || '-';
                        if (col.render) renderVal = col.render(item[col.key], item);
                        html += `
                            <div class="flex flex-col min-w-0 w-full">
                                <span class="text-[9px] md:text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-0.5 md:mb-1 lg:hidden truncate">${col.label}</span>
                                <span class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate w-full block">${renderVal}</span>
                            </div>
                        `;
                    });
                    html += `
                            </div>
                            <div class="flex items-center gap-2 justify-end shrink-0 border-t sm:border-none border-slate-100 dark:border-white/5 pt-3 sm:pt-0 mt-1 sm:mt-0">
                                <button data-action="edit" data-id="${item.id}" data-col="${colName}" class="p-2 text-slate-400 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors rounded-lg hover:bg-blue-50 dark:hover:bg-cyan-500/10 border border-transparent hover:border-blue-200 dark:hover:border-cyan-500/20"><i data-lucide="edit-2" class="w-4 h-4 pointer-events-none"></i></button>
                                <button data-action="delete" data-id="${item.id}" data-col="${colName}" class="p-2 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors rounded-lg hover:bg-rose-50 dark:hover:bg-rose-500/10 border border-transparent hover:border-rose-200 dark:hover:border-rose-500/20"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            return html;
        }

        // --- STREAMING_CHUNK:Lógica Específica de Renderização (Escolas, Turmas, Alunos, etc) ---

        function getSchoolName(id) { return state.data.schools.find(s => s.id === id)?.name || '-'; }
        function getCourseName(id) { return state.data.courses.find(c => c.id === id)?.name || '-'; }
        function getClassName(id) { return state.data.classes.find(c => c.id === id)?.name || '-'; }

        function renderCrud(view) {
            if (view === 'schools') return generateCrudHTML('Unidades', 'school', state.data.schools, [{label: 'Nome da Unidade', key: 'name'}, {label: 'Status', key: 'status', render: CyberStatusHTML}], 'schools');
            if (view === 'courses') return generateCrudHTML('Cursos', 'book-marked', state.data.courses, [{label: 'Formação', key: 'name'}, {label: 'Unidade Base', key: 'schoolId', render: getSchoolName}, {label: 'Status', key: 'status', render: CyberStatusHTML}], 'courses');
            if (view === 'classes') return generateCrudHTML('Turmas', 'layers', state.data.classes, [{label: 'Identificador', key: 'name'}, {label: 'Curso', key: 'courseId', render: getCourseName}, {label: 'Unidade', key: 'schoolId', render: getSchoolName}], 'classes');
            if (view === 'students') return generateCrudHTML('Discentes', 'users', state.data.students, [{label: 'Nome Completo', key: 'name'}, {label: 'Turma Atual', key: 'classId', render: getClassName}, {label: 'Status', key: 'status', render: CyberStatusHTML}], 'students');
            return '';
        }

        // ATTENDANCE VIEW HTML
        function renderAttendance() {
            const sid = $('att-school')?.value || '';
            const cid = $('att-class')?.value || '';
            
            const schOpts = `<option value="" class="bg-[#0A0A0C]">Selecione...</option>` + state.data.schools.map(s => `<option value="${s.id}" class="bg-[#0A0A0C]" ${sid===s.id?'selected':''}>${s.name}</option>`).join('');
            const filteredClasses = state.data.classes.filter(c => c.schoolId === sid);
            const clsOpts = `<option value="" class="bg-[#0A0A0C]">Selecione...</option>` + filteredClasses.map(c => `<option value="${c.id}" class="bg-[#0A0A0C]" ${cid===c.id?'selected':''}>${c.name}</option>`).join('');
            
            let html = `
                <div class="space-y-6 md:space-y-8 animate-fade-in">
                    <div class="animate-fade-in-up">
                        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tighter">Diário de Aulas</h1>
                        <p class="text-blue-600 dark:text-cyan-400/80 mt-1 font-medium tracking-wide text-xs md:text-sm">Controle de frequência contínuo e responsivo.</p>
                    </div>
                    <div class="relative bg-white/80 dark:bg-gradient-to-br dark:from-white/[0.05] dark:to-transparent rounded-2xl md:rounded-3xl border border-slate-200 dark:border-white/10 backdrop-blur-2xl p-4 md:p-6 shadow-sm dark:shadow-none animate-fade-in-up">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                            <div class="flex flex-col gap-1.5"><label class="text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">Unidade Escolar</label><div class="relative group"><select id="att-school" data-action="update-att-filters" class="relative w-full px-4 py-2.5 md:py-3 appearance-none bg-white/90 dark:bg-[#0A0A0C]/80 backdrop-blur-md border border-slate-200 dark:border-white/10 rounded-xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none text-slate-900 dark:text-white shadow-sm dark:shadow-inner text-sm">${schOpts}</select><i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-500 dark:text-cyan-400 pointer-events-none"></i></div></div>
                            <div class="flex flex-col gap-1.5"><label class="text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">Turma / Horário</label><div class="relative group"><select id="att-class" data-action="update-att-filters" ${!sid?'disabled':''} class="relative w-full px-4 py-2.5 md:py-3 appearance-none bg-white/90 dark:bg-[#0A0A0C]/80 backdrop-blur-md border border-slate-200 dark:border-white/10 rounded-xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none text-slate-900 dark:text-white disabled:opacity-50 shadow-sm dark:shadow-inner text-sm">${clsOpts}</select><i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-500 dark:text-cyan-400 pointer-events-none"></i></div></div>
                        </div>
                    </div>
            `;

            if (cid) {
                const currentClass = state.data.classes.find(c=>c.id===cid);
                const currentCourse = state.data.courses.find(c=>c.id===currentClass?.courseId);
                const currentStudents = state.data.students.filter(s=>s.classId===cid && s.status==='Ativo').sort((a,b)=>a.name.localeCompare(b.name));
                
                const mYear = state.attendanceDate.getFullYear();
                const mMonth = state.attendanceDate.getMonth();
                
                const records = state.data.attendance.filter(a => {
                    if(a.classId !== cid) return false;
                    const d = new Date(a.date+'T12:00:00');
                    return d.getMonth() === mMonth && d.getFullYear() === mYear;

                        `;
                        
                        records.forEach(r => {
                            const isPresent = r.records[student.id];
                            html += `
                                <button data-action="toggle-att" data-rid="${r.id}" data-sid="${student.id}" data-curr="${isPresent}" class="flex items-stretch rounded-lg border overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-sm dark:shadow-none shrink-0 ${isPresent ? 'border-emerald-200 dark:border-emerald-500/30' : 'border-rose-200 dark:border-rose-500/30'}">

        // --- STREAMING_CHUNK:Controlador Principal de Renderização ---

        function renderCurrentView() {
            if (!state.user) return;
            const container = $('main-content');
            
            if (state.currentView === 'dashboard') container.innerHTML = renderDashboard();
            else if (['schools', 'courses', 'classes', 'students'].includes(state.currentView)) container.innerHTML = renderCrud(state.currentView);
            else if (state.currentView === 'attendance') container.innerHTML = renderAttendance();
            else if (state.currentView === 'projects') container.innerHTML = renderProjects();
            
            lucide.createIcons({ root: container });
            renderMenu();
        }

        // Search Listener (Debounce otimizado)
        let searchTimeout;
        $('global-search').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if(['schools', 'courses', 'classes', 'students'].includes(state.currentView)) renderCurrentView();
            }, 300);
        });

        // --- STREAMING_CHUNK:Lógica de Formulários Dinâmicos ---
        
        function openFormModal(colName, item = null) {
            state.formCollection = colName;
            state.formItemEditing = item;
            $('modal-form-title').innerText = item ? 'Atualizar Registro' : 'Novo Registro';
            
            let formHTML = '';
            const inpt = (label, id, type='text', req=true, val='') => `
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">${label}</label>
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-cyan-500 dark:to-purple-500 rounded-xl blur opacity-0 group-focus-within:opacity-20 dark:group-focus-within:opacity-30 transition duration-500"></div>
                        <input type="${type}" id="${id}" value="${val}" ${req?'required':''} class="relative w-full px-4 py-2.5 md:py-3 bg-white/90 dark:bg-[#0A0A0C]/80 backdrop-blur-md border border-slate-200 dark:border-white/10 rounded-xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none transition-all duration-300 text-slate-900 dark:text-white shadow-sm dark:shadow-inner text-sm" />
                    </div>
                </div>
            `;
            const sel = (label, id, opts, val='', extra='') => `
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase ml-1">${label}</label>
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-cyan-500 dark:to-purple-500 rounded-xl blur opacity-0 group-focus-within:opacity-20 dark:group-focus-within:opacity-30 transition duration-500"></div>
                        <select id="${id}" ${extra} class="relative w-full px-4 py-2.5 md:py-3 appearance-none bg-white/90 dark:bg-[#0A0A0C]/80 backdrop-blur-md border border-slate-200 dark:border-white/10 rounded-xl focus:border-blue-500/50 dark:focus:border-cyan-500/50 outline-none transition-all duration-300 text-slate-900 dark:text-white shadow-sm dark:shadow-inner text-sm">
                            <option value="" class="dark:bg-[#0A0A0C] bg-white">Selecione...</option>
                            ${opts.map(o => `<option value="${o.v}" class="dark:bg-[#0A0A0C] bg-white" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-500 dark:text-cyan-400 pointer-events-none"></i>
                    </div>
                </div>
            `;
            
            const stsOpts = [{v:'Ativo',l:'Operante/Ativo'},{v:'Inativo',l:'Inoperante/Inativo'}];
            const schOpts = state.data.schools.map(s => ({v:s.id, l:s.name}));

            if(colName === 'schools') {
                formHTML += inpt('Identificação da Escola', 'f-name', 'text', true, item?.name||'');
                formHTML += sel('Status Operacional', 'f-status', stsOpts, item?.status||'Ativo');
            } else if(colName === 'courses') {
                formHTML += inpt('Nomenclatura do Curso', 'f-name', 'text', true, item?.name||'');
                formHTML += sel('Unidade Vinculada', 'f-school', schOpts, item?.schoolId||'');
                formHTML += sel('Status', 'f-status', stsOpts, item?.status||'Ativo');
            } else if(colName === 'classes') {
                formHTML += inpt('Código/Nome da Turma', 'f-name', 'text', true, item?.name||'');
                formHTML += sel('Unidade Base', 'f-school', schOpts, item?.schoolId||'', 'data-action="form-school-change"');
                const crsOpts = state.data.courses.filter(c => c.schoolId === (item?.schoolId||'')).map(c=>({v:c.id, l:c.name}));
                formHTML += sel('Curso Vinculado', 'f-course', crsOpts, item?.courseId||'', item?.schoolId?'':'disabled');
                formHTML += sel('Status', 'f-status', stsOpts, item?.status||'Ativo');
            } else if(colName === 'students') {
                formHTML += inpt('Nome do Aluno', 'f-name', 'text', true, item?.name||'');
                formHTML += sel('Unidade', 'f-school', schOpts, item?.schoolId||'', 'data-action="form-school-change-stu"');
                const clsOpts = state.data.classes.filter(c => c.schoolId === (item?.schoolId||'')).map(c=>({v:c.id, l:c.name}));
                formHTML += sel('Turma', 'f-class', clsOpts, item?.classId||'', item?.schoolId?'':'disabled');
                formHTML += sel('Status', 'f-status', stsOpts, item?.status||'Ativo');
            }

            formHTML += `
                <div class="pt-4 md:pt-6 flex justify-end gap-3 mt-2 md:mt-4 border-t border-slate-200 dark:border-white/5">
                    <button type="button" data-action="close-form" class="relative inline-flex items-center justify-center px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm transition-all bg-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5">Cancelar</button>
                    <button type="submit" class="relative inline-flex items-center justify-center px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm transition-all overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-cyan-500 dark:to-purple-600 opacity-90 group-hover:opacity-100 transition-opacity"></div>
                        <span class="relative z-10 text-white">Gravar Dados</span>
                    </button>
                </div>
            `;

            $('dynamic-form').innerHTML = formHTML;
            $('modal-form').classList.remove('hidden-safely');
            lucide.createIcons({ root: $('modal-form') });
        }

        function closeFormModal() {
            $('modal-form').classList.add('hidden-safely');
            state.formCollection = null;
            state.formItemEditing = null;
        }
        $('btn-close-form').addEventListener('click', closeFormModal);
        $('modal-form-overlay').addEventListener('click', closeFormModal);

        $('dynamic-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const colName = state.formCollection;
            const data = {};
            
            if(colName === 'schools') {
                data.name = $('f-name').value;
                data.status = $('f-status').value;
            } else if(colName === 'courses') {
                data.name = $('f-name').value;
                data.schoolId = $('f-school').value;
                data.status = $('f-status').value;
            } else if(colName === 'classes') {
                data.name = $('f-name').value;
                data.schoolId = $('f-school').value;
                data.courseId = $('f-course').value;
                data.status = $('f-status').value;
            } else if(colName === 'students') {
                data.name = $('f-name').value;
                data.schoolId = $('f-school').value;
                data.classId = $('f-class').value;
                data.status = $('f-status').value;
            }

            if(state.formItemEditing) await API.update(colName, state.formItemEditing.id, data);
            else await API.add(colName, data);
            
            closeFormModal();
        });

        // --- DELEGAÇÃO DE EVENTOS GLOBAL ---
        document.body.addEventListener('change', e => {
            if(e.target.dataset.action === 'form-school-change') {
                const sid = e.target.value;
                const cSelect = $('f-course');
                const crsOpts = state.data.courses.filter(c => c.schoolId === sid).map(c=>`<option value="${c.id}" class="dark:bg-[#0A0A0C] bg-white">${c.name}</option>`);
                cSelect.innerHTML = `<option value="" class="dark:bg-[#0A0A0C] bg-white">Selecione...</option>` + crsOpts.join('');
                cSelect.disabled = !sid;
            }
            if(e.target.dataset.action === 'form-school-change-stu') {
                const sid = e.target.value;
                const cSelect = $('f-class');
                const clsOpts = state.data.classes.filter(c => c.schoolId === sid).map(c=>`<option value="${c.id}" class="dark:bg-[#0A0A0C] bg-white">${c.name}</option>`);
                cSelect.innerHTML = `<option value="" class="dark:bg-[#0A0A0C] bg-white">Selecione...</option>` + clsOpts.join('');
                cSelect.disabled = !sid;
            }
            if(e.target.dataset.action === 'update-att-filters') {
                renderCurrentView(); // Re-renderiza o painel de attendance
            }
        });

        document.body.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;

            if (action === 'navigate') {
                state.currentView = btn.dataset.view;
                $('global-search').value = '';
                renderCurrentView();
            }
            else if (action === 'logout') { signOut(auth); }
            else if (action === 'open-form') { openFormModal(btn.dataset.col); }
            else if (action === 'close-form') { closeFormModal(); }
            else if (action === 'edit') {
                const item = state.data[btn.dataset.col].find(i => i.id === btn.dataset.id);
                openFormModal(btn.dataset.col, item);
            }
            else if (action === 'delete') {
                showConfirmModal('Excluir Registro', 'Esta ação removerá o dado do banco e não pode ser desfeita.', () => {
                    API.remove(btn.dataset.col, btn.dataset.id);
                });
            }
            // Attendance actions
            else if (action === 'att-prev-month') { state.attendanceDate.setMonth(state.attendanceDate.getMonth() - 1); renderCurrentView(); }
            else if (action === 'att-next-month') { state.attendanceDate.setMonth(state.attendanceDate.getMonth() + 1); renderCurrentView(); }
            else if (action === 'att-new-class') {
                const sid = $('att-school').value;
                const cid = $('att-class').value;
                if(!cid) return;
                
                let formHTML = `
                    <div class="flex flex-col gap-1.5"><label class="text-[10px] font-bold text-blue-600 dark:text-cyan-400/80 uppercase">Data da Aula</label>
                    <input type="date" id="new-att-date" value="${new Date().toISOString().split('T')[0]}" class="w-full px-4 py-3 bg-white/90 dark:bg-[#0A0A0C]/80 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white" required></div>
                    <div class="bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl overflow-hidden mt-4 w-full">
                        <div class="p-3 bg-slate-100 dark:bg-black/40 border-b border-slate-200 dark:border-white/5"><h4 class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase">Presença Rápida</h4></div>
                        <div class="max-h-[50vh] overflow-y-auto overflow-x-hidden custom-scrollbar p-2 space-y-1.5" id="new-att-list">
                `;
                
                const students = state.data.students.filter(s=>s.classId===cid && s.status==='Ativo').sort((a,b)=>a.name.localeCompare(b.name));
                students.forEach(s => {
                    formHTML += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl bg-white dark:bg-white/5 border border-transparent hover:border-slate-200 dark:hover:border-white/10 transition-colors gap-2">
                            <span class="font-bold text-sm text-slate-800 dark:text-slate-200 truncate">${s.name}</span>
                            <button type="button" data-action="toggle-new-att" data-sid="${s.id}" data-val="true" class="w-full sm:w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-emerald-100 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30">
                                <span class="font-black text-sm pointer-events-none">P</span><span class="text-[9px] uppercase pointer-events-none">Presente</span>
                            </button>
                        </div>
                    `;
                });
                
                formHTML += `</div></div>
                    <div class="pt-4 flex justify-end gap-3 mt-4 border-t border-slate-200 dark:border-white/5">
                        <button type="button" data-action="close-form" class="px-4 py-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white font-bold text-sm">Cancelar</button>
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700 shadow-lg">Salvar Aula</button>
                    </div>
                `;
                
                $('dynamic-form').innerHTML = formHTML;
                $('modal-form-title').innerText = "Lançar Nova Aula";
                
                // Override submit for this specific form
                const tempSubmit = async (e) => {
                    e.preventDefault();
                    const d = $('new-att-date').value;
                    const recs = {};
                    document.querySelectorAll('[data-action="toggle-new-att"]').forEach(b => { recs[b.dataset.sid] = b.dataset.val === 'true'; });
                    await API.add('attendance', { classId: cid, schoolId: sid, date: d, records: recs });
                    closeFormModal();
                    $('dynamic-form').removeEventListener('submit', tempSubmit); // cleanup
                };
                $('dynamic-form').addEventListener('submit', tempSubmit);
                $('modal-form').classList.remove('hidden-safely');
            }
            else if (action === 'toggle-new-att') {
                const isP = btn.dataset.val === 'true';
                btn.dataset.val = (!isP).toString();
                if(!isP) {
                    btn.className = "w-full sm:w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-emerald-100 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30";
                    btn.innerHTML = `<span class="font-black text-sm pointer-events-none">P</span><span class="text-[9px] uppercase pointer-events-none">Presente</span>`;
                } else {
                    btn.className = "w-full sm:w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-rose-100 dark:bg-rose-500/20 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-500/30";
                    btn.innerHTML = `<span class="font-black text-sm pointer-events-none">F</span><span class="text-[9px] uppercase pointer-events-none">Falta</span>`;
                }
            }
            else if (action === 'toggle-att') {
                const rid = btn.dataset.rid;
                const sid = btn.dataset.sid;
                const curr = btn.dataset.curr === 'true';
                const record = state.data.attendance.find(a=>a.id===rid);
                if(record) {
                    record.records[sid] = !curr;
                    await API.update('attendance', rid, {records: record.records});
                }
            }
            // Projects Logic
            else if (action === 'open-pdf-form') {
                let formHTML = `
                    <div class="flex flex-col gap-1.5"><label class="text-[10px] font-bold text-blue-600 dark:text-cyan-400/80 uppercase">Identificação</label><input type="text" id="pdf-name" required class="w-full px-4 py-3 bg-white/90 dark:bg-[#0A0A0C]/80 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white" /></div>
                    <div class="flex flex-col gap-1.5 mt-4"><label class="text-[10px] font-bold text-blue-600 dark:text-cyan-400/80 uppercase">Tag Curricular</label><input type="text" id="pdf-sub" class="w-full px-4 py-3 bg-white/90 dark:bg-[#0A0A0C]/80 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white" /></div>
                    <div class="flex flex-col gap-1.5 mt-4">
                        <label class="text-[10px] font-bold tracking-widest text-blue-600 dark:text-cyan-400/80 uppercase">Pacote de Dados (PDF)</label>
                        <div class="relative border-2 border-dashed border-blue-300 dark:border-cyan-500/30 bg-blue-50 dark:bg-cyan-500/5 rounded-2xl p-8 md:p-12 text-center hover:bg-blue-100 dark:hover:bg-cyan-500/10 transition-colors">
                            <input type="file" id="pdf-file" accept="application/pdf" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                            <i data-lucide="file-up" class="w-8 h-8 md:w-10 md:h-10 mx-auto text-blue-500 dark:text-cyan-400 mb-2 pointer-events-none"></i>
                            <p id="pdf-filename" class="text-xs font-bold text-blue-600 dark:text-cyan-400 pointer-events-none">Clique para anexar o PDF</p>
                        </div>
                    </div>
                    <div class="pt-6 flex justify-end gap-3 mt-4 border-t border-slate-200 dark:border-white/5">
                        <button type="button" data-action="close-form" class="px-4 py-2 text-slate-500 font-bold">Cancelar</button>
                        <button type="submit" id="btn-pdf-submit" class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg flex items-center gap-2">Iniciar Uplink</button>
                    </div>
                `;
                $('dynamic-form').innerHTML = formHTML;
                $('modal-form-title').innerText = "Transferir Arquivo";
                
                $('pdf-file').addEventListener('change', e => {
                    const f = e.target.files[0];
                    if(f && f.type === 'application/pdf') $('pdf-filename').innerText = f.name;
                    else { showToast('Apenas PDF.', 'error'); e.target.value=''; $('pdf-filename').innerText='Clique para anexar o PDF'; }
                });

                $('dynamic-form').onsubmit = async (e) => {
                    e.preventDefault();
                    const file = $('pdf-file').files[0];
                    if(!file) return;
                    $('btn-pdf-submit').innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Enviando...';
                    lucide.createIcons({ root: $('btn-pdf-submit') });
                    try {
                        const sRef = ref(storage, `artifacts/${appIdStr}/users/${state.user.uid}/projects/${Date.now()}_${file.name}`);
                        await uploadBytes(sRef, file);
                        const url = await getDownloadURL(sRef);
                        await API.add('projects', { name: $('pdf-name').value, subject: $('pdf-sub').value, fileName: file.name, pdfUrl: url, size: file.size });
                        closeFormModal();
                    } catch(err) { showToast('Falha no upload.', 'error'); console.error(err); }
                };

                $('modal-form').classList.remove('hidden-safely');
                lucide.createIcons({ root: $('modal-form') });
            }
            else if (action === 'open-pdf') {
                $('pdf-iframe').src = btn.dataset.url;
                $('modal-pdf').classList.remove('hidden-safely');
            }
        });

        $('btn-close-pdf').addEventListener('click', () => { $('modal-pdf').classList.add('hidden-safely'); $('pdf-iframe').src = ''; });

        // --- STREAMING_CHUNK:Autenticação e Inicialização ---
        
        let isRegisterMode = false;

        $('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnContent = $('login-btn-content');
            const email = $('login-email').value;
            const pass = $('login-password').value;
            const name = $('login-name').value;
            const originalHTML = btnContent.innerHTML;
            
            btnContent.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            lucide.createIcons({ root: btnContent });
            
            try {
                if (isRegisterMode) {
                    if(!name) {
                        showToast('Preencha seu nome completo para cadastrar.', 'error');
                        btnContent.innerHTML = originalHTML;
                        lucide.createIcons({ root: btnContent });
                        return;
                    }
                    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                    await updateProfile(userCred.user, { displayName: name });
                    showToast('Conta criada com sucesso!', 'success');
                } else {
                    if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                        await signInWithCustomToken(auth, window.__initial_auth_token);
                    } else {
                        await signInWithEmailAndPassword(auth, email, pass);
                    }
                }
            } catch (err) { 
                console.error(err);
                if(err.code === 'auth/email-already-in-use') showToast('E-mail já está em uso.', 'error');
                else if(err.code === 'auth/weak-password') showToast('A senha deve ter pelo menos 6 caracteres.', 'error');
                else showToast(isRegisterMode ? 'Erro ao criar conta.' : 'Falha nas credenciais. Verifique e-mail e senha.', 'error'); 
                btnContent.innerHTML = originalHTML;
                lucide.createIcons({ root: btnContent });
            }
        });

        $('btn-create-account').addEventListener('click', () => {
            if(!isRegisterMode) {
                isRegisterMode = true;
                $('register-name-group').classList.remove('hidden-safely');
                $('login-btn-content').innerHTML = '<span class="mt-0.5">Criar Conta</span><i data-lucide="user-plus" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>';
                $('create-account-content').innerText = 'Voltar para Login';
            } else {
                isRegisterMode = false;
                $('register-name-group').classList.add('hidden-safely');
                $('login-btn-content').innerHTML = '<span class="mt-0.5">Autorizar Acesso</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>';
                $('create-account-content').innerText = 'Criar Nova Conta';
            }
            lucide.createIcons({ root: $('login-form') });
        });

        onAuthStateChanged(auth, async (user) => {
            $('initial-loading').classList.add('hidden-safely');
            if (user) {
                state.user = user;
                
                // Extrai e Injeta os Dados do Usuário Logado de forma segura
                const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'Convidado');
                $('user-display-name').innerText = displayName;
                $('user-avatar-initial').innerText = displayName ? displayName.charAt(0).toUpperCase() : 'U';

                $('login-view').classList.add('hidden-safely');
                $('app-view').classList.remove('hidden-safely');
                applyTheme();
                renderMenu();
                await initDataListeners();
            } else {
                state.user = null;
                state.unsubscribes.forEach(u => u());
                state.unsubscribes = [];
                $('app-view').classList.add('hidden-safely');
                $('login-view').classList.remove('hidden-safely');
            }
        });

        // Auto login check para o ambiente de preview
        if (!auth.currentUser && typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
            signInWithCustomToken(auth, window.__initial_auth_token).catch(()=>{});
        }

        // Setup Inicial UI
        applyTheme();
        lucide.createIcons();

    </script>
</body>
</html>
