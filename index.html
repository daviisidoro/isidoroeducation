<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isidoro Education</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root { color-scheme: dark; } /* Força elementos nativos a ficarem escuros */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050507; 
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Oculta inputs de number spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Scrollbar Moderna */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(34, 211, 238, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(34, 211, 238, 0.6); }

        /* Animações Ultra (Aceleradas por GPU) */
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
        }
        .animate-toast {
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }
        .animate-blob {
            animation: blob 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale3d(0.95, 0.95, 1); }
            to { opacity: 1; transform: scale3d(1, 1, 1); }
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate3d(0, 20px, 0) scale3d(0.9, 0.9, 1); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
        }
        @keyframes blob {
            0% { transform: translate3d(0px, 0px, 0) scale(1); }
            33% { transform: translate3d(40px, -40px, 0) scale(1.05); }
            66% { transform: translate3d(-30px, 30px, 0) scale(0.95); }
            100% { transform: translate3d(0px, 0px, 0) scale(1); }
        }

        /* Correção para fundo de inputs automáticos no Chrome */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0A0A0C inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <!-- Container Principal do App -->
    <div id="app-root"></div>

    <!-- Container de Toasts (Notificações) -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[300] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Modal Dinâmico Universal -->
    <div id="universal-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeModal('universal-modal')"></div>
        <div class="relative w-full max-w-lg bg-[#0A0A0C] border border-white/10 rounded-[2rem] shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col max-h-[90dvh] animate-scale-in">
            <div class="flex items-center justify-between p-6 border-b border-white/5 relative z-10">
                <h3 id="modal-title" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400 tracking-tight">Título</h3>
                <button onclick="closeModal('universal-modal')" class="p-2 text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-full transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto custom-scrollbar relative z-10">
                <!-- Conteúdo injetado via JS -->
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação (Substitui window.confirm) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[250] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeConfirmModal()"></div>
        <div class="relative w-full max-w-sm bg-[#0A0A0C] border border-white/10 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col animate-scale-in text-center p-6">
            <div class="w-16 h-16 mx-auto bg-rose-500/10 text-rose-400 rounded-full flex items-center justify-center mb-4 border border-rose-500/20 shadow-[0_0_15px_rgba(244,63,94,0.2)]">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2 tracking-tight">Tem certeza?</h3>
            <p id="confirm-message" class="text-sm text-slate-400 mb-6">Esta ação não pode ser desfeita.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirmModal()" class="px-5 py-3 rounded-xl font-bold text-sm text-slate-300 bg-white/5 hover:bg-white/10 transition-colors w-full">Cancelar</button>
                <button id="confirm-action-btn" class="px-5 py-3 rounded-xl font-bold text-sm text-rose-400 bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500 hover:text-white transition-all w-full shadow-[0_0_15px_rgba(244,63,94,0.1)] hover:shadow-[0_0_20px_rgba(244,63,94,0.3)]">Excluir</button>
            </div>
        </div>
    </div>

    <!-- Modal Visualizador de PDF -->
    <div id="pdf-modal" class="hidden fixed inset-0 z-[250] flex flex-col bg-black/95 backdrop-blur-2xl animate-fade-in-up">
        <div class="flex justify-between items-center p-6 border-b border-white/10 bg-[#0A0A0C]/50">
            <h3 class="text-cyan-400 font-bold text-sm tracking-widest uppercase flex items-center gap-2">
                <i data-lucide="eye" class="w-4 h-4"></i> Visualizador de Documento
            </h3>
            <button onclick="closeModal('pdf-modal')" class="p-2 text-white/50 hover:text-white bg-white/5 hover:bg-white/10 rounded-full transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <div class="flex-1 w-full h-full p-4 md:p-10 flex justify-center">
            <iframe id="pdf-iframe" src="" class="w-full h-full max-w-6xl bg-white rounded-3xl shadow-[0_0_50px_rgba(34,211,238,0.1)]" title="PDF Viewer"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8UUMslBPn5slrYBx5ML0WXXAPbvaz_DA",
            authDomain: "isidoro-education1.firebaseapp.com",
            projectId: "isidoro-education1",
            storageBucket: "isidoro-education1.firebasestorage.app",
            messagingSenderId: "270653580018",
            appId: "1:270653580018:web:9e9af560fff3fed256266b",
            measurementId: "G-WPR4NQP26K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const state = {
            user: null,
            authLoading: true,
            currentView: 'attendance',
            isMobileMenuOpen: false,
            searchTerm: '',
            viewDate: new Date(),
            collections: {
                schools: [], courses: [], classes: [], students: [], attendance: [], projects: []
            },
            unsubs: [],
            editingItem: null,
            editingCollection: null,
            confirmCallback: null
        };

        const LOGO_URL = "logo.png";

        const menuItems = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'schools', label: 'Unidades', icon: 'school' },
            { id: 'courses', label: 'Cursos', icon: 'book-marked' },
            { id: 'classes', label: 'Turmas', icon: 'layers' },
            { id: 'students', label: 'Alunos', icon: 'users' },
            { id: 'attendance', label: 'Diário de Aulas', icon: 'calendar-check' },
            { id: 'projects', label: 'Vault PDF', icon: 'file-text' }
        ];

        window.showToast = (msg, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const baseClass = "flex items-center gap-4 px-6 py-5 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] backdrop-blur-2xl border font-bold text-sm pointer-events-auto animate-toast";
            const typeClass = type === 'success' ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400' :
                              type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' :
                              'bg-[#0A0A0C]/90 border-white/10 text-white';
            
            const icon = type === 'success' ? '<i data-lucide="check" class="w-5 h-5 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]"></i>' :
                         type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5 drop-shadow-[0_0_8px_rgba(244,63,94,0.8)]"></i>' : '';

            toast.className = `${baseClass} ${typeClass}`;
            toast.innerHTML = `${icon} <span>${msg}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px) scale(0.9)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        window.showConfirm = (msg, callback) => {
            document.getElementById('confirm-message').innerText = msg;
            state.confirmCallback = callback;
            openModal('confirm-modal');
        };
        window.closeConfirmModal = () => {
            state.confirmCallback = null;
            closeModal('confirm-modal');
        };

        const formatDateShort = (dateStr) => {
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}`;
        };

        const getMonthName = (monthIndex) => {
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            return months[monthIndex];
        };

        const getDayOfWeekShort = (dateStr) => {
            const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
            const d = new Date(dateStr + 'T12:00:00');
            return days[d.getDay()];
        };

        const setupListeners = () => {
            state.unsubs.forEach(unsub => unsubscribe());
            state.unsubs = [];

            if (!state.user) return;

            const cols = ['schools', 'courses', 'classes', 'students', 'attendance', 'projects'];
            cols.forEach(colName => {
                const q = collection(db, `isidoro_data/${state.user.uid}/${colName}`);
                const unsub = onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    state.collections[colName] = items;
                    renderApp();
                }, (error) => {
                    console.error("Erro ao buscar", colName, error);
                });
                state.unsubs.push(unsub);
            });
        };

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            state.authLoading = false;
            if (user) setupListeners();
            renderApp();
        });

        const getInitials = (name, email) => {
            if (name) return name.charAt(0).toUpperCase();
            if (email) return email.charAt(0).toUpperCase();
            return 'A';
        };

        const getDisplayName = (name, email) => {
            if (name) return name;
            if (email) return email.split('@')[0];
            return 'Administrador';
        };

        const renderApp = () => {
            const root = document.getElementById('app-root');
            if (state.authLoading) {
                root.innerHTML = `<div class="min-h-screen flex items-center justify-center"><i data-lucide="loader-2" class="w-12 h-12 text-cyan-400 animate-spin drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]"></i></div>`;
            } else if (!state.user) {
                root.innerHTML = renderLogin();
                attachLoginEvents();
            } else {
                root.innerHTML = renderLayout();
                attachLayoutEvents();
                renderCurrentView();
            }
            lucide.createIcons();
        };

        const renderLogin = () => `
            <div class="min-h-[100dvh] flex items-center justify-center p-4 relative overflow-x-hidden overflow-y-auto">
                <div class="absolute top-[-10%] left-[-10%] w-[70vw] h-[70vw] bg-cyan-600/20 rounded-full blur-[150px] mix-blend-screen animate-blob pointer-events-none"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-purple-600/20 rounded-full blur-[120px] mix-blend-screen animate-blob animation-delay-2000 pointer-events-none"></div>
                
                <div class="w-full max-w-md relative z-10 py-10">
                    <div class="mb-10 text-center animate-fade-in-up">
                        <img src="${LOGO_URL}" onerror="this.src='https://placehold.co/600x400/transparent/001f3f?text=Isidoro+Education'" alt="Logo" class="w-48 md:w-56 h-auto object-contain mx-auto rounded-3xl bg-[#0A0A0C] border border-cyan-500/50 p-4 shadow-[0_0_40px_rgba(34,211,238,0.3)] mb-6 transition-transform hover:scale-105">
                        <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 tracking-tighter">Isidoro Education</h2>
                        <p class="text-cyan-400/80 mt-2 text-xs font-bold tracking-[0.3em] uppercase">Enterprise Protocol</p>
                    </div>

                    <div class="bg-white/[0.02] backdrop-blur-3xl p-8 md:p-10 rounded-[2.5rem] shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-white/10 animate-scale-in relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500"></div>
                        <form id="login-form" class="space-y-5">
                            
                            <div id="name-field-container" class="space-y-2 group hidden opacity-0 transition-opacity duration-300">
                                <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Nome Completo</label>
                                <div class="relative">
                                    <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-2xl blur opacity-0 group-focus-within:opacity-30 transition duration-500"></div>
                                    <input type="text" id="login-name" placeholder="Ex: Diretor Isidoro" class="relative w-full px-5 py-4 bg-black/40 border border-white/10 rounded-2xl focus:border-cyan-500/50 outline-none transition-all text-white placeholder:text-slate-600 shadow-inner">
                                </div>
                            </div>

                            <div class="space-y-2 group">
                                <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Credencial de Acesso</label>
                                <div class="relative">
                                    <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-2xl blur opacity-0 group-focus-within:opacity-30 transition duration-500"></div>
                                    <input type="email" id="login-email" required placeholder="admin@isidoro.edu" class="relative w-full px-5 py-4 bg-black/40 border border-white/10 rounded-2xl focus:border-cyan-500/50 outline-none transition-all text-white placeholder:text-slate-600 shadow-inner">
                                </div>
                            </div>
                            <div class="space-y-2 group">
                                <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Chave de Segurança</label>
                                <div class="relative">
                                    <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-2xl blur opacity-0 group-focus-within:opacity-30 transition duration-500"></div>
                                    <input type="password" id="login-pass" required placeholder="••••••••" class="relative w-full px-5 py-4 bg-black/40 border border-white/10 rounded-2xl focus:border-cyan-500/50 outline-none transition-all text-white placeholder:text-slate-600 shadow-inner">
                                </div>
                            </div>
                            
                            <button type="submit" id="btn-login" class="w-full relative flex items-center justify-center px-6 py-4 mt-8 rounded-2xl font-black text-white transition-all shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:shadow-[0_0_40px_rgba(34,211,238,0.5)] hover:-translate-y-1 group overflow-hidden bg-[#0A0A0C] border border-cyan-500/50">
                                <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 to-purple-600 opacity-20 group-hover:opacity-40 transition-opacity"></div>
                                <span class="relative z-10 flex items-center gap-3 tracking-widest uppercase text-xs">
                                    <span class="mt-0.5">Autorizar Acesso</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                                </span>
                            </button>

                            <button type="button" id="btn-toggle-create" class="w-full text-center text-xs font-bold text-slate-400 hover:text-cyan-400 tracking-widest uppercase mt-4 transition-colors">
                                Criar Nova Conta
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        `;

        const attachLoginEvents = () => {
            let isCreating = false;
            
            document.getElementById('btn-toggle-create').addEventListener('click', (e) => {
                isCreating = !isCreating;
                const nameContainer = document.getElementById('name-field-container');
                const btnLogin = document.getElementById('btn-login').querySelector('span span');
                
                if(isCreating) {
                    nameContainer.classList.remove('hidden');
                    setTimeout(() => nameContainer.classList.remove('opacity-0'), 10);
                    e.target.innerText = "Já tenho uma conta";
                    btnLogin.innerText = "Registrar e Acessar";
                    document.getElementById('login-name').required = true;
                } else {
                    nameContainer.classList.add('opacity-0');
                    setTimeout(() => nameContainer.classList.add('hidden'), 300);
                    e.target.innerText = "Criar Nova Conta";
                    btnLogin.innerText = "Autorizar Acesso";
                    document.getElementById('login-name').required = false;
                }
            });

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const pass = document.getElementById('login-pass').value;
                const name = document.getElementById('login-name').value;
                const btn = document.getElementById('btn-login');
                const originalHtml = btn.innerHTML;
                
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
                lucide.createIcons({root: btn});
                btn.disabled = true;

                try {
                    if (isCreating) {
                        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                        await updateProfile(userCred.user, { displayName: name });
                        showToast('Conta criada com sucesso!', 'success');
                    } else {
                        await signInWithEmailAndPassword(auth, email, pass);
                        showToast('Acesso autorizado!', 'success');
                    }
                } catch (error) {
                    showToast('Credenciais inválidas ou erro no servidor.', 'error');
                    console.error(error);
                    btn.innerHTML = originalHtml;
                    lucide.createIcons({root: btn});
                    btn.disabled = false;
                }
            });
        };

        const renderLayout = () => {
            const userName = getDisplayName(state.user.displayName, state.user.email);
            const userInitial = getInitials(state.user.displayName, state.user.email);

            return `
            <div class="flex h-[100dvh] overflow-hidden">
                
                <!-- Sidebar Desktop -->
                <div class="hidden md:block h-full z-40 relative shadow-2xl shadow-black/50">
                    <div class="flex flex-col h-full bg-[#050507]/80 backdrop-blur-3xl border-r border-white/5 w-72 transition-all duration-500">
                        ${renderSidebarInner()}
                    </div>
                </div>

                <!-- Sidebar Mobile Overlay -->
                <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-50 flex">
                    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm animate-fade-in-up" onclick="toggleMobileMenu()"></div>
                    <div class="relative w-72 h-full bg-[#0A0A0C] animate-scale-in flex flex-col border-r border-white/10">
                         ${renderSidebarInner()}
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex-1 flex flex-col min-w-0 h-full relative">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.02] pointer-events-none mix-blend-overlay"></div>
                    
                    <header class="sticky top-0 z-30 flex items-center justify-between px-4 md:px-8 py-4 md:py-6 mx-2 md:mx-4 mt-2 md:mt-4 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-2xl md:rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
                        <div class="flex items-center gap-4 w-full md:w-auto">
                            <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 text-white bg-white/10 rounded-xl hover:bg-white/20 transition-colors">
                                <i data-lucide="menu" class="w-5 h-5"></i>
                            </button>
                            
                            <div class="flex items-center relative w-full md:w-64 lg:w-96 group">
                                <i data-lucide="search" class="w-4 h-4 md:w-5 md:h-5 absolute left-4 text-slate-400 group-focus-within:text-cyan-400 transition-colors"></i>
                                <input type="text" id="global-search" placeholder="Pesquisar..." class="w-full pl-10 md:pl-12 pr-4 py-2.5 md:py-3 rounded-xl md:rounded-2xl bg-black/20 border border-white/10 focus:border-cyan-500/50 outline-none text-xs md:text-sm transition-all shadow-inner placeholder:text-slate-500 text-white truncate">
                            </div>
                        </div>

                        <div class="hidden md:flex items-center gap-5">
                            <div class="flex items-center gap-4 pl-5 border-l border-white/10">
                                <div class="text-right truncate max-w-[150px]">
                                    <p class="text-sm font-bold text-white truncate">${userName}</p>
                                    <p class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest truncate">Nível Máximo</p>
                                </div>

                    <div class="animate-fade-in-up">
                        <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tighter">Diário de Aulas</h1>
                        <p class="text-cyan-400/80 mt-1 font-medium tracking-wide text-xs md:text-sm">Controle de frequência compacto.</p>
                    </div>

                    <div class="relative bg-gradient-to-br from-white/[0.05] to-transparent rounded-3xl border border-white/10 p-4 md:p-6 animate-fade-in-up">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                            <div class="flex flex-col gap-2">
                                <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Unidade Escolar</label>
                                <select id="att-school" onchange="window.updateAttFilters()" class="w-full px-4 py-3 bg-[#0A0A0C]/80 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500/50 text-sm">
                                    <option value="">Selecione...</option>${schoolsOpts}
                                </select>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Turma / Horário</label>
                                <select id="att-class" onchange="window.updateAttFilters()" ${!sid?'disabled':''} class="w-full px-4 py-3 bg-[#0A0A0C]/80 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500/50 disabled:opacity-50 text-sm">
                                    <option value="">Selecione a Escola...</option>${classesOpts}
                                </select>
                            </div>
                        </div>
                    </div>

                    ${cid ? `
                    <div class="relative bg-gradient-to-br from-white/[0.05] to-transparent rounded-3xl border border-white/10 border-t-4 border-t-cyan-500 p-0 flex flex-col overflow-hidden animate-fade-in-up">
                        <div class="p-4 md:p-6 border-b border-white/5 bg-white/[0.02]">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div class="flex items-center justify-center gap-4 w-full md:w-auto">
                                    <button onclick="window.changeAttMonth(-1)" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl text-slate-300 transition-colors"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                                    <h2 class="text-xl md:text-2xl font-bold text-white capitalize tracking-tight text-center min-w-[160px]">
                                        ${getMonthName(m)} de ${y}
                                    </h2>
                                    <button onclick="window.changeAttMonth(1)" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl text-slate-300 transition-colors"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                                </div>
                                <button onclick="window.openNewClassModal()" class="w-full md:w-auto relative inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm transition-all overflow-hidden group">
                                    <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 opacity-80 group-hover:opacity-100"></div>
                                    <span class="relative z-10 text-white flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Nova Aula</span>
                                </button>
                            </div>
                        </div>

                        <div class="p-4 space-y-4">
                            ${currentStudents.length === 0 ? `<p class="p-10 text-center text-slate-500 text-sm">Nenhum aluno ativo nesta turma.</p>` : 
                              currentStudents.map(student => {
                                  let tP=0, tF=0;
                                  recs.forEach(r => { if(r.records[student.id]) tP++; else if(r.records[student.id]===false) tF++; });
                                  
                                  return `
                                  <div class="bg-[#0A0A0C] border border-white/10 rounded-2xl p-4 md:p-5 flex flex-col gap-4 shadow-sm hover:border-cyan-500/30 transition-colors">
                                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/5 pb-3 min-w-0">
                                          <span class="font-bold text-white text-sm md:text-base truncate">${student.name}</span>
                                          <div class="flex items-center gap-2 shrink-0">
                                              <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-[10px] font-bold uppercase tracking-wider shadow-[0_0_10px_rgba(16,185,129,0.1)]">P: ${tP}</span>
                                              <span class="px-3 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg text-[10px] font-bold uppercase tracking-wider shadow-[0_0_10px_rgba(244,63,94,0.1)]">F: ${tF}</span>
                                          </div>
                                      </div>
                                      
                                      <div class="flex flex-wrap gap-2">
                                          ${recs.length===0 ? '<span class="text-xs text-slate-500 py-1">Sem aulas registradas no mês.</span>' : ''}
                                          ${recs.map(record => {
                                              const isP = record.records[student.id];
                                              const bClass = isP ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                                              const textP = isP ? 'Presente' : 'Falta';
                                              return `
                                              <button onclick="window.toggleAtt('${record.id}', '${student.id}', ${isP})" class="flex items-stretch rounded-lg border overflow-hidden transition-transform active:scale-95 ${bClass} shadow-sm group">
                                                  <div class="bg-black/40 px-2 py-1.5 flex flex-col items-center justify-center border-r border-inherit min-w-[40px]">
                                                      <span class="text-[10px] md:text-xs font-bold text-slate-300">${formatDateShort(record.date)}</span>
                                                  </div>
                                                  <div class="px-3 py-1.5 flex items-center justify-center gap-1.5 font-black text-sm group-hover:brightness-125">
                                                      <span>${isP ? 'P' : 'F'}</span>
                                                      <span class="text-[9px] md:text-[10px] uppercase tracking-wider ml-0.5">${textP}</span>
                                                  </div>
                                              </button>
                                              `;
                                          }).join('')}
                                      </div>
                                  </div>
                                  `;
                              }).join('')
                            }
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        };

        window.updateAttFilters = () => {
            state.attSchoolId = document.getElementById('att-school').value;
            state.attClassId = document.getElementById('att-class')?.value || '';
            renderCurrentView();
        };

        window.changeAttMonth = (delta) => {
            state.viewDate.setMonth(state.viewDate.getMonth() + delta);
            renderCurrentView();
        };

        window.toggleAtt = async (recordId, studentId, isCurrentlyP) => {
            const rec = state.collections.attendance.find(a=>a.id===recordId);
            if(!rec) return;
            const newRecords = {...rec.records, [studentId]: !isCurrentlyP};
            try {
                await updateDoc(doc(db, `isidoro_data/${state.user.uid}/attendance`, recordId), { records: newRecords });
            } catch(e) { showToast('Erro ao atualizar.', 'error'); }
        };

        window.openNewClassModal = () => {
            const cid = state.attClassId;
            const students = state.collections.students.filter(s=>s.classId===cid && s.status==='Ativo');
            
            // Build Initial State Map inside DOM for extraction on submit
            const defaultDate = new Date().toISOString().split('T')[0];
            
            document.getElementById('modal-title').innerText = "Lançar Nova Aula";
            document.getElementById('modal-content').innerHTML = `
                <form id="new-att-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Data da Sessão</label>
                        <input type="date" id="na-date" required value="${defaultDate}" class="w-full px-4 py-3 bg-[#0A0A0C]/80 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500/50">
                    </div>
                    <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                        <div class="p-3 md:p-4 bg-black/40 border-b border-white/5">
                            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Presença Rápida</h4>
                        </div>
                        <div class="max-h-[40vh] overflow-y-auto custom-scrollbar p-2 space-y-2" id="na-student-list">
                            ${students.map(s => `
                                <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-transparent hover:border-white/10">
                                    <span class="font-bold text-xs md:text-sm text-slate-200 truncate">${s.name}</span>
                                    <button type="button" data-sid="${s.id}" data-val="true" onclick="window.toggleNaBtn(this)" class="w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shrink-0">
                                        <span class="font-black text-sm btn-pf">P</span>
                                        <span class="text-[9px] uppercase tracking-wider btn-txt">Presente</span>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="pt-4 flex justify-end gap-3 border-t border-white/5">
                        <button type="button" onclick="closeModal('universal-modal')" class="px-5 py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:text-white hover:bg-white/5">Cancelar</button>
                        <button type="submit" id="btn-save-na" class="relative inline-flex items-center justify-center px-6 py-2.5 rounded-xl font-bold text-sm transition-all overflow-hidden group">
                            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 opacity-80 group-hover:opacity-100"></div>
                            <span class="relative z-10 text-white flex items-center gap-2">Salvar Aula</span>
                        </button>
                    </div>
                </form>
            `;
            openModal('universal-modal');

            document.getElementById('new-att-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-save-na');
                btn.innerHTML = `<span class="relative z-10 text-white flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Salvando</span>`;
                lucide.createIcons({root:btn});
                btn.disabled = true;

                const date = document.getElementById('na-date').value;
                const recs = {};
                document.querySelectorAll('#na-student-list button').forEach(b => {
                    recs[b.dataset.sid] = b.dataset.val === 'true';
                });

                try {
                    await addDoc(collection(db, `isidoro_data/${state.user.uid}/attendance`), {
                        schoolId: state.attSchoolId, classId: state.attClassId, date: date, records: recs
                    });
                    showToast('Aula salva.', 'success');
                    closeModal('universal-modal');
                } catch(err) {
                    showToast('Erro ao salvar.', 'error');
                }
                btn.disabled = false;
            };
        };

        window.toggleNaBtn = (btn) => {
            const isP = btn.dataset.val === 'true';
            if (isP) {
                btn.dataset.val = 'false';
                btn.className = "w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-rose-500/20 text-rose-400 border border-rose-500/30 shrink-0";
                btn.querySelector('.btn-pf').innerText = 'F';
                btn.querySelector('.btn-txt').innerText = 'Falta';
            } else {
                btn.dataset.val = 'true';
                btn.className = "w-28 h-9 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shrink-0";
                btn.querySelector('.btn-pf').innerText = 'P';
                btn.querySelector('.btn-txt').innerText = 'Presente';
            }
        };

        const renderProjects = () => {
            let data = state.collections.projects;
            if (state.searchTerm) {
                const t = state.searchTerm.toLowerCase();
                data = data.filter(p => p.name.toLowerCase().includes(t) || (p.subject||'').toLowerCase().includes(t));
            }

            return `
                <div class="space-y-6 md:space-y-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-fade-in-up">
                        <div>
                            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tighter">Vault de Arquivos</h1>
                            <p class="text-cyan-400/80 mt-1 font-medium tracking-wide text-xs md:text-sm">Armazenamento em nuvem criptografado.</p>
                        </div>
                        <button onclick="window.openUploadModal()" class="w-full sm:w-auto relative inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm transition-all overflow-hidden group shrink-0">
                            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 opacity-80 group-hover:opacity-100"></div>
                            <span class="relative z-10 text-white flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Enviar Arquivo</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 mt-6">
                        ${data.length === 0 ? `
                            <div class="col-span-full py-20 flex flex-col items-center justify-center text-center border-2 border-dashed border-white/10 rounded-[2rem] bg-white/5 animate-fade-in-up">
                                <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mb-4"><i data-lucide="upload-cloud" class="w-8 h-8 text-slate-400"></i></div>
                                <h3 class="text-lg font-bold text-white mb-1">Vault Vazio</h3>
                                <p class="text-sm text-slate-500 max-w-xs">Nenhum projeto PDF encontrado.</p>
                            </div>
                        ` : data.map((p, i) => `
                            <div class="group relative bg-[#0A0A0C]/80 backdrop-blur-xl border border-white/10 rounded-[2rem] p-5 md:p-6 hover:-translate-y-1.5 transition-all duration-500 animate-fade-in-up hover:border-cyan-500/50 hover:shadow-[0_10px_40px_-10px_rgba(34,211,238,0.3)]" style="animation-delay: ${i*50}ms">
                                <div class="flex justify-between items-start mb-5 relative z-10">
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-500/20 border border-cyan-500/30 flex items-center justify-center shadow-[0_0_15px_rgba(34,211,238,0.2)] shrink-0">
                                        <i data-lucide="file-text" class="w-5 h-5 text-cyan-400"></i>
                                    </div>
                                    <button onclick="window.confirmCrudDelete('${p.id}')" class="p-2 bg-rose-500/10 text-rose-400 rounded-xl hover:bg-rose-500 hover:text-white transition-all opacity-0 group-hover:opacity-100 shrink-0 border border-rose-500/20"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                                <h3 class="text-base font-bold text-white mb-1 line-clamp-2 leading-tight">${p.name}</h3>
                                <p class="text-[10px] font-bold text-cyan-400/80 uppercase tracking-widest mb-4">${p.subject || 'Geral'}</p>
                                
                                <div class="grid grid-cols-2 gap-2 pt-4 border-t border-white/10">
                                    <button onclick="window.openPdfViewer('${p.pdfUrl}')" class="flex items-center justify-center px-2 py-2 rounded-xl text-xs font-bold text-slate-200 bg-white/5 hover:bg-white/10 border border-white/10 transition-colors"><i data-lucide="eye" class="w-3.5 h-3.5 mr-1.5"></i> Abrir</button>
                                    <a href="${p.pdfUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center px-2 py-2 rounded-xl text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/20 transition-colors"><i data-lucide="download" class="w-3.5 h-3.5 mr-1.5"></i> Salvar</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.openUploadModal = () => {
            document.getElementById('modal-title').innerText = "Uplink de Arquivo";
            document.getElementById('modal-content').innerHTML = `
                <form id="upload-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Nome do Material</label>
                        <input type="text" id="up-name" required class="w-full px-4 py-3 bg-[#0A0A0C]/80 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500/50">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Disciplina/Tag</label>
                        <input type="text" id="up-tag" class="w-full px-4 py-3 bg-[#0A0A0C]/80 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500/50">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">Arquivo PDF</label>
                        <div class="relative border-2 border-dashed border-cyan-500/30 bg-cyan-500/5 rounded-2xl p-8 md:p-12 text-center hover:bg-cyan-500/10 transition-colors">
                            <input type="file" id="up-file" accept="application/pdf" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="window.updateFileName(this)">
                            <div class="w-12 h-12 bg-[#0A0A0C] border border-cyan-500/50 shadow-[0_0_15px_rgba(34,211,238,0.3)] rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="file-up" class="w-5 h-5 text-cyan-400"></i></div>
                            <p id="up-file-name" class="text-xs md:text-sm font-medium text-slate-400">Selecione o PDF</p>
                        </div>
                    </div>
                    <div class="pt-4 flex justify-end gap-3 border-t border-white/5">
                        <button type="button" onclick="closeModal('universal-modal')" class="px-5 py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:text-white hover:bg-white/5">Cancelar</button>
                        <button type="submit" id="btn-save-up" class="relative inline-flex items-center justify-center px-6 py-2.5 rounded-xl font-bold text-sm transition-all overflow-hidden group">
                            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 opacity-80 group-hover:opacity-100"></div>
                            <span class="relative z-10 text-white flex items-center gap-2">Iniciar Uplink</span>
                        </button>
                    </div>
                </form>
            `;
            openModal('universal-modal');

            document.getElementById('upload-form').onsubmit = async (e) => {
                e.preventDefault();
                const file = document.getElementById('up-file').files[0];
                if(!file || file.type !== 'application/pdf'){ showToast('Apenas PDF válido.', 'error'); return; }

                const btn = document.getElementById('btn-save-up');
                btn.innerHTML = `<span class="relative z-10 text-white flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Enviando...</span>`;
                lucide.createIcons({root:btn});
                btn.disabled = true;

                try {
                    const refP = ref(storage, `isidoro_data/${state.user.uid}/projects/${Date.now()}_${file.name}`);
                    await uploadBytes(refP, file);
                    const url = await getDownloadURL(refP);
                    
                    await addDoc(collection(db, `isidoro_data/${state.user.uid}/projects`), {
                        name: document.getElementById('up-name').value,
                        subject: document.getElementById('up-tag').value,
                        fileName: file.name, pdfUrl: url, size: file.size, createdAt: Date.now()
                    });
                    showToast('Upload concluído.', 'success');
                    closeModal('universal-modal');
                } catch(e) {
                    showToast('Falha no upload.', 'error');
                }
                btn.disabled = false;
            };
        };

        window.updateFileName = (input) => {
            const t = document.getElementById('up-file-name');
            if(input.files[0]) {
                t.innerText = input.files[0].name;
                t.classList.add('text-cyan-400', 'font-bold');
            }
        };

        window.openPdfViewer = (url) => {
            document.getElementById('pdf-iframe').src = url;
            openModal('pdf-modal');
        };

        // Handlers de confirmação genérica
        document.getElementById('confirm-action-btn').addEventListener('click', () => {
            if(state.confirmCallback) state.confirmCallback();
        });

        // Initialize App (Trigger rendering of Login spinner initially handled by body empty state, replaced by onAuthStateChanged)
        renderApp();
    </script>
</body>
</html>
